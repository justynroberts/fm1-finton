# SPDX-License-Identifier: GPL-3.0-only
# Publish the web flasher (web/) on GitHub Pages: https://<user>.github.io/<repo>/
# web/firmware/ holds the release the page installs (tools/make_web.sh build/finton-X.Y.fwsc, then commit).
name: flasher
on:
  push:
    branches: [main]
    paths: ["web/**"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the bundled firmware
        run: |
          test -f web/firmware/finton.fwsc && test -f web/firmware/manifest.json
          python3 -c "import json,hashlib;m=json.load(open('web/firmware/manifest.json'));d=open('web/firmware/'+m['file'],'rb').read();assert hashlib.sha256(d).hexdigest()==m['sha256'],'manifest sha256 does not match';print(m)"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v4
